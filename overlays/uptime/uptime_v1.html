<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Uptime</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #uptime {
      display: inline-block;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
      text-shadow:
        2px 2px 3px rgba(0, 0, 0, 0.9),
        -1px -1px 2px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="uptime">00:00:00</div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const username = (params.get("username") || "").trim().toLowerCase();
    const uptimeElement = document.getElementById("uptime");

    let displayedSeconds = null;
    let secondTimer = null;

    function formatTime(totalSeconds) {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));

      const hours = Math.floor(safeSeconds / 3600);
      const minutes = Math.floor((safeSeconds % 3600) / 60);
      const seconds = safeSeconds % 60;

      return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
      ].join(":");
    }

    function render() {
      if (displayedSeconds === null) {
        uptimeElement.textContent = "00:00:00";
        return;
      }

      uptimeElement.textContent = formatTime(displayedSeconds);
    }

    function parseDecapiUptime(text) {
      const value = text.trim().toLowerCase();

      if (
        !value ||
        value.includes("offline") ||
        value.includes("not live") ||
        value.includes("not streaming") ||
        value.includes("error")
      ) {
        return null;
      }

      let total = 0;
      let foundValue = false;

      const days = value.match(/(\d+)\s*(?:day|days)/);
      const hours = value.match(/(\d+)\s*(?:hour|hours|hr|hrs)/);
      const minutes = value.match(/(\d+)\s*(?:minute|minutes|min|mins)/);
      const seconds = value.match(/(\d+)\s*(?:second|seconds|sec|secs)/);

      if (days) {
        total += Number(days[1]) * 86400;
        foundValue = true;
      }

      if (hours) {
        total += Number(hours[1]) * 3600;
        foundValue = true;
      }

      if (minutes) {
        total += Number(minutes[1]) * 60;
        foundValue = true;
      }

      if (seconds) {
        total += Number(seconds[1]);
        foundValue = true;
      }

      return foundValue ? total : null;
    }

    function startLiveCounter() {
      if (secondTimer) {
        return;
      }

      secondTimer = setInterval(() => {
        if (displayedSeconds === null) {
          return;
        }

        displayedSeconds += 1;
        render();
      }, 1000);
    }

    async function syncWithDecapi() {
      if (!username) {
        console.error("Missing username. Use ?username=yourtwitchname");
        displayedSeconds = null;
        render();
        return;
      }

      try {
        const url =
          `https://decapi.me/twitch/uptime?channel=${encodeURIComponent(username)}` +
          `&offline_msg=OFFLINE`;

        const response = await fetch(url, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`DecAPI returned HTTP ${response.status}`);
        }

        const text = await response.text();
        const uptimeInSeconds = parseDecapiUptime(text);

        if (uptimeInSeconds === null) {
          displayedSeconds = null;
          render();
          return;
        }

        displayedSeconds = uptimeInSeconds;
        render();
        startLiveCounter();
      } catch (error) {
        console.error("DecAPI uptime request failed:", error);

        /*
          Keep counting if DecAPI briefly fails after a successful response.
          On first-load failure, it stays at 00:00:00.
        */
        if (displayedSeconds === null) {
          render();
        }
      }
    }

    syncWithDecapi();

    /*
      The visible timer increments locally every second.
      This just corrects the value from DecAPI occasionally.
    */
    setInterval(syncWithDecapi, 30000);
  </script>
</body>
</html>
