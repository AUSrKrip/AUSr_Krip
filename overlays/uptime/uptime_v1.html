<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Uptime</title>

  <style>
    :root {
      --background: #0b8fe8;
      --text: #ffffff;
      --shadow: rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #uptime-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 260px;
      height: 60px;
      padding: 0 14px;
      background: var(--background);
      color: var(--text);
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
      text-shadow: 0 2px 3px var(--shadow);
    }
  </style>
</head>

<body>
  <div id="uptime-wrap">
    <span id="uptime">Loading...</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const username = (params.get("username") || "").trim().toLowerCase();
    const backgroundColour = params.get("bg") || "#0b8fe8";
    const textColour = params.get("color") || "#ffffff";
    const configuredFontSize = Number.parseInt(params.get("size") || "34", 10);

    const fontSize = Number.isFinite(configuredFontSize)
      ? Math.min(120, Math.max(12, configuredFontSize))
      : 34;

    const uptimeWrap = document.getElementById("uptime-wrap");
    const uptimeElement = document.getElementById("uptime");

    document.documentElement.style.setProperty("--background", backgroundColour);
    document.documentElement.style.setProperty("--text", textColour);
    uptimeWrap.style.fontSize = `${fontSize}px`;

    function showMessage(message) {
      uptimeElement.textContent = message;
    }

    async function updateUptime() {
      if (!username) {
        showMessage("NO USERNAME");
        return;
      }

      try {
        /*
          DecAPI returns plain text, such as:
          "1 hour 14 minutes 38 seconds"

          If the channel is offline, DecAPI generally returns a text response
          indicating that the stream is not live.
        */
        const endpoint =
          `https://decapi.me/twitch/uptime?channel=${encodeURIComponent(username)}`;

        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`DecAPI returned HTTP ${response.status}`);
        }

        const uptimeText = (await response.text()).trim();

        if (
          !uptimeText ||
          /offline|not live|not streaming|error/i.test(uptimeText)
        ) {
          showMessage("OFFLINE");
          return;
        }

        showMessage(uptimeText);
      } catch (error) {
        console.error("Could not load Twitch uptime from DecAPI:", error);
        showMessage("UPTIME ERROR");
      }
    }

    updateUptime();

    /*
      DecAPI gives the current formatted text, so refresh it every 15 seconds.
      Smaller values create needless requests and do not guarantee better
      match with Twitch's own UI.
    */
    setInterval(updateUptime, 15000);
  </script>
</body>
</html>
