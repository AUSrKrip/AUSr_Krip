<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Uptime</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }

    #uptime {
      display: inline-block;
      margin: 0;
      padding: 0;
      background: transparent !important;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
      text-shadow: none !important;
      filter: none !important;
      box-shadow: none !important;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="uptime">00:00:00</div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const username = (params.get("username") || "").trim().toLowerCase();
    const uptimeElement = document.getElementById("uptime");

    /*
      DecAPI's recorded stream start is currently 14 seconds later than
      Twitch's on-page timer for your channel.

      Change this to 0 if it ever matches naturally.
      Change it to 13, 14, 15, etc. if Twitch's timer differs later.
    */
    const OFFSET_SECONDS = 14;

    let displayedSeconds = null;
    let secondTimer = null;

    function formatTime(totalSeconds) {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));

      const hours = Math.floor(safeSeconds / 3600);
      const minutes = Math.floor((safeSeconds % 3600) / 60);
      const seconds = safeSeconds % 60;

      return [
        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
      ].join(":");
    }

    function render() {
      uptimeElement.textContent =
        displayedSeconds === null
          ? "00:00:00"
          : formatTime(displayedSeconds);
    }

    function parseDecapiUptime(text) {
      const value = text.trim().toLowerCase();

      if (
        !value ||
        value.includes("offline") ||
        value.includes("not live") ||
        value.includes("not streaming") ||
        value.includes("error")
      ) {
        return null;
      }

      let total = 0;
      let foundValue = false;

      const days = value.match(/(\d+)\s*(?:day|days)/);
      const hours = value.match(/(\d+)\s*(?:hour|hours|hr|hrs)/);
      const minutes = value.match(/(\d+)\s*(?:minute|minutes|min|mins)/);
      const seconds = value.match(/(\d+)\s*(?:second|seconds|sec|secs)/);

      if (days) {
        total += Number(days[1]) * 86400;
        foundValue = true;
      }

      if (hours) {
        total += Number(hours[1]) * 3600;
        foundValue = true;
      }

      if (minutes) {
        total += Number(minutes[1]) * 60;
        foundValue = true;
      }

      if (seconds) {
        total += Number(seconds[1]);
        foundValue = true;
      }

      return foundValue ? total : null;
    }

    function startCounter() {
      if (secondTimer) {
        return;
      }

      secondTimer = setInterval(() => {
        if (displayedSeconds === null) {
          return;
        }

        displayedSeconds += 1;
        render();
      }, 1000);
    }

    async function syncWithDecapi() {
      if (!username) {
        console.error("Add a Twitch username: ?username=lookwhotalkin");
        displayedSeconds = null;
        render();
        return;
      }

      try {
        const endpoint =
          `https://decapi.me/twitch/uptime?channel=${encodeURIComponent(username)}` +
          `&offline_msg=OFFLINE`;

        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`DecAPI returned HTTP ${response.status}`);
        }

        const returnedText = await response.text();
        const decapiSeconds = parseDecapiUptime(returnedText);

        if (decapiSeconds === null) {
          displayedSeconds = null;
          render();
          return;
        }

        displayedSeconds = decapiSeconds + OFFSET_SECONDS;
        render();
        startCounter();
      } catch (error) {
        console.error("Unable to update DecAPI uptime:", error);

        if (displayedSeconds === null) {
          render();
        }
      }
    }

    syncWithDecapi();

    /*
      The timer itself updates each second.
      DecAPI is only used to re-check/correct it every 30 seconds.
    */
    setInterval(syncWithDecapi, 30000);
  </script>
</body>
</html>
