<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Uptime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; font-family: Ubuntu, sans-serif; }
    #uptime { color: #fff; font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  </style>
</head>
<body>
  <span id="uptime">Loading…</span>
  <script>
    const channel = (new URLSearchParams(location.search).get('username') || 'ausr_krip').trim().replace(/^@/, '');
    const display = document.getElementById('uptime');
    let uptimeAtSync = null;
    let syncedAt = 0;

    function parseUptime(text) {
      const clock = text.match(/\b(?:(\d+):)?(\d{1,2}):(\d{2})\b/);
      if (clock) return Number(clock[1] || 0) * 3600 + Number(clock[2]) * 60 + Number(clock[3]);

      let seconds = 0;
      let found = false;
      const units = /\b(\d+)\s*(days?|hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/gi;
      for (const match of text.matchAll(units)) {
        const unit = match[2].toLowerCase();
        const factor = unit.startsWith('day') ? 86400 : unit.startsWith('hour') || unit.startsWith('hr') ? 3600 : unit.startsWith('min') ? 60 : 1;
        seconds += Number(match[1]) * factor;
        found = true;
      }
      return found ? seconds : null;
    }

    function render() {
      if (uptimeAtSync === null) return;
      const seconds = uptimeAtSync + Math.floor((Date.now() - syncedAt) / 1000);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;
      display.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
    }

    async function refresh() {
      if (!/^[a-zA-Z0-9_]+$/.test(channel)) {
        display.textContent = 'Invalid username';
        return;
      }
      try {
        const url = new URL('https://decapi.me/twitch/uptime');
        url.searchParams.set('channel', channel);
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = (await response.text()).trim();
        if (/offline|not live/i.test(text)) {
          uptimeAtSync = null;
          display.textContent = 'Offline';
          return;
        }
        const seconds = parseUptime(text);
        if (seconds === null) throw new Error(`Unknown uptime format: ${text}`);
        uptimeAtSync = seconds;
        syncedAt = Date.now();
        render();
      } catch (error) {
        console.error('DecAPI uptime error:', error);
        if (uptimeAtSync === null) display.textContent = 'Uptime unavailable';
      }
    }

    refresh();
    setInterval(render, 250);
    setInterval(refresh, 30000);
  </script>
</body>
</html>
