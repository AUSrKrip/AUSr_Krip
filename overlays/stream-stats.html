<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stream Stats Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; }
    .stats { display: flex; align-items: center; gap: 28px; color: #fff; font: 700 48px/1 Ubuntu, Arial, sans-serif; white-space: nowrap; }
    .stat { display: inline-flex; align-items: center; gap: 12px; }
    .icon { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; font-size: 43px; line-height: 1; }
    .icon svg { display: block; width: 45px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .value { min-width: 1ch; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="stats">
    <div class="stat"><span class="icon" aria-hidden="true">★</span><span class="value" id="subs">—</span></div>
    <div class="stat"><span class="icon" aria-hidden="true">♥</span><span class="value" id="followers">—</span></div>
    <div class="stat"><span class="icon" aria-hidden="true">👁</span><span class="value" id="viewers">—</span></div>
  </div>
  <script>
    const channel = (new URLSearchParams(location.search).get('username') || 'ausr_krip').trim().replace(/^@/, '');

    async function get(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = (await response.text()).trim();
      if (!/^\d[\d,]*$/.test(text)) throw new Error(`Unexpected API response: ${text}`);
      return Number(text.replace(/,/g, '')).toLocaleString('en-AU');
    }

    async function update(id, url) {
      try {
        document.getElementById(id).textContent = await get(url);
      } catch (error) {
        console.error(`${id} failed:`, error);
        document.getElementById(id).textContent = '—';
      }
    }

    function refresh() {
      if (!/^[a-zA-Z0-9_]+$/.test(channel)) return;
      const user = encodeURIComponent(channel);
      update('subs', `https://decapi.me/twitch/subcount?channel=${user}`);
      update('followers', `https://decapi.me/twitch/followcount/${user}`);
      update('viewers', `https://decapi.me/twitch/viewercount/${user}`);
    }

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
